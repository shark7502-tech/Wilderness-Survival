<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>孫氏集團 - 角色與場景圖庫</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            color: #fff;
            padding: 20px;
            min-height: 100vh;
        }

        .container {
            max-width: 1800px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            margin-bottom: 50px;
            border-bottom: 3px solid #d4af37;
            padding-bottom: 30px;
        }

        .header h1 {
            font-size: 48px;
            color: #d4af37;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.7);
            margin-bottom: 10px;
        }

        .header p {
            font-size: 16px;
            color: #aaa;
            margin: 5px 0;
        }

        /* ============= 標籤導航 ============= */
        .tabs {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 40px;
            flex-wrap: wrap;
        }

        .tab-btn {
            padding: 12px 25px;
            border: 2px solid #d4af37;
            background: linear-gradient(135deg, #2c3e50 0%, #34495e 100%);
            color: #d4af37;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            font-size: 14px;
            transition: all 0.3s ease;
        }

        .tab-btn:hover {
            background: linear-gradient(135deg, #34495e 0%, #2c3e50 100%);
            box-shadow: 0 0 15px rgba(212, 175, 55, 0.5);
        }

        .tab-btn.active {
            background: linear-gradient(135deg, #d4af37 0%, #c9a227 100%);
            color: #000;
        }

        /* ============= 內容區域 ============= */
        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* ============= 角色展示 ============= */
        .character-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(400px, 1fr));
            gap: 40px;
            margin-bottom: 50px;
        }

        .character-card {
            background: rgba(0, 0, 0, 0.5);
            border: 3px solid #d4af37;
            border-radius: 10px;
            padding: 30px;
            text-align: center;
            transition: all 0.3s ease;
        }

        .character-card:hover {
            transform: translateY(-10px);
            box-shadow: 0 10px 30px rgba(212, 175, 55, 0.3);
        }

        .character-image {
            width: 100%;
            height: 400px;
            margin-bottom: 20px;
            background: rgba(212, 175, 55, 0.05);
            border: 1px solid #d4af37;
            border-radius: 5px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .character-image svg {
            width: 100%;
            height: 100%;
            max-width: 250px;
            max-height: 350px;
        }

        .character-name {
            font-size: 28px;
            color: #d4af37;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .character-description {
            font-size: 14px;
            color: #aaa;
            margin-top: 10px;
            line-height: 1.6;
        }

        /* ============= 場景展示 ============= */
        .scene-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(500px, 1fr));
            gap: 30px;
            margin-bottom: 50px;
        }

        .scene-card {
            background: rgba(0, 0, 0, 0.5);
            border: 3px solid #d4af37;
            border-radius: 10px;
            overflow: hidden;
            transition: all 0.3s ease;
        }

        .scene-card:hover {
            transform: scale(1.02);
            box-shadow: 0 10px 30px rgba(212, 175, 55, 0.3);
        }

        .scene-image {
            width: 100%;
            height: 300px;
            background: rgba(212, 175, 55, 0.05);
            border-bottom: 2px solid #d4af37;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .scene-image svg {
            width: 100%;
            height: 100%;
        }

        .scene-info {
            padding: 20px;
        }

        .scene-name {
            font-size: 22px;
            color: #d4af37;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .scene-description {
            font-size: 13px;
            color: #aaa;
            line-height: 1.6;
        }

        .scene-type {
            display: inline-block;
            margin-top: 10px;
            padding: 5px 12px;
            background: rgba(212, 175, 55, 0.2);
            border: 1px solid #d4af37;
            border-radius: 20px;
            font-size: 12px;
            color: #d4af37;
        }

        /* ============= 資源統計 ============= */
        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 50px;
        }

        .stat-card {
            background: rgba(212, 175, 55, 0.1);
            border: 2px solid #d4af37;
            padding: 20px;
            border-radius: 5px;
            text-align: center;
        }

        .stat-number {
            font-size: 36px;
            color: #d4af37;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .stat-label {
            font-size: 14px;
            color: #aaa;
        }

        /* ============= 下載和匯出 ============= */
        .export-section {
            background: rgba(0, 0, 0, 0.5);
            border: 3px solid #d4af37;
            padding: 30px;
            border-radius: 10px;
            margin-top: 50px;
            text-align: center;
        }

        .export-section h3 {
            font-size: 22px;
            color: #d4af37;
            margin-bottom: 20px;
        }

        .export-buttons {
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
        }

        .export-btn {
            padding: 12px 25px;
            border: 2px solid #d4af37;
            background: linear-gradient(135deg, #2c3e50 0%, #34495e 100%);
            color: #d4af37;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s ease;
        }

        .export-btn:hover {
            background: linear-gradient(135deg, #34495e 0%, #2c3e50 100%);
            box-shadow: 0 0 15px rgba(212, 175, 55, 0.5);
        }

        .back-btn {
            position: fixed;
            top: 20px;
            left: 20px;
            padding: 10px 20px;
            border: 2px solid #d4af37;
            background: linear-gradient(135deg, #2c3e50 0%, #34495e 100%);
            color: #d4af37;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s ease;
            z-index: 999;
        }

        .back-btn:hover {
            background: linear-gradient(135deg, #34495e 0%, #2c3e50 100%);
            box-shadow: 0 0 15px rgba(212, 175, 55, 0.5);
        }

        @media (max-width: 768px) {
            .character-grid {
                grid-template-columns: 1fr;
            }

            .scene-grid {
                grid-template-columns: 1fr;
            }

            .header h1 {
                font-size: 32px;
            }
        }
    </style>
</head>
<body>
    <button class="back-btn" onclick="history.back()">← 返回</button>

    <div class="container">
        <div class="header">
            <h1>🎨 孫氏集團 - 角色與場景圖庫</h1>
            <p>完整的遊戲視覺資源庫</p>
        </div>

        <!-- 標籤導航 -->
        <div class="tabs">
            <button class="tab-btn active" onclick="switchTab('characters')">👥 角色圖片</button>
            <button class="tab-btn" onclick="switchTab('scenes')">🏝️ 荒島場景</button>
            <button class="tab-btn" onclick="switchTab('stats')">📊 資源統計</button>
        </div>

        <!-- 角色圖片標籤 -->
        <div class="tab-content active" id="characters">
            <div class="character-grid" id="characterGrid">
                <!-- 動態加載角色 -->
            </div>
        </div>

        <!-- 場景圖片標籤 -->
        <div class="tab-content" id="scenes">
            <div class="scene-grid" id="sceneGrid">
                <!-- 動態加載場景 -->
            </div>
        </div>

        <!-- 資源統計標籤 -->
        <div class="tab-content" id="stats">
            <div class="stats" id="statsContainer">
                <!-- 動態加載統計 -->
            </div>
            
            <div class="export-section">
                <h3>📥 資源匯出</h3>
                <div class="export-buttons">
                    <button class="export-btn" onclick="exportCharacterJSON()">
                        📥 下載角色JSON
                    </button>
                    <button class="export-btn" onclick="exportSceneJSON()">
                        📥 下載場景JSON
                    </button>
                    <button class="export-btn" onclick="exportAllSVG()">
                        📥 下載所有SVG
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script src="game-resources.js"></script>
    <script>
        // ============= 初始化 =============
        function initializePage() {
            loadCharacters();
            loadScenes();
            loadStats();
        }

        // ============= 加載角色 =============
        function loadCharacters() {
            const grid = document.getElementById('characterGrid');
            grid.innerHTML = '';

            const characters = getAllCharacters();
            characters.forEach(char => {
                const svgContent = getSVG(char.svgUrl.substring(1));
                const card = document.createElement('div');
                card.className = 'character-card';
                card.innerHTML = `
                    <div class="character-image">
                        ${svgContent}
                    </div>
                    <div class="character-name">${char.name}</div>
                    <div class="character-description">${char.description}</div>
                `;
                grid.appendChild(card);
            });
        }

        // ============= 加載場景 =============
        function loadScenes() {
            const grid = document.getElementById('sceneGrid');
            grid.innerHTML = '';

            const scenes = getAllScenes();
            scenes.forEach(scene => {
                const svgContent = getSVG(scene.backgroundUrl.substring(1));
                const card = document.createElement('div');
                card.className = 'scene-card';
                card.innerHTML = `
                    <div class="scene-image">
                        ${svgContent}
                    </div>
                    <div class="scene-info">
                        <div class="scene-name">${scene.emoji} ${scene.name}</div>
                        <div class="scene-description">${scene.description}</div>
                        <div class="scene-type">${scene.type === 'safe' ? '✅ 安全區' : scene.type === 'danger' ? '⚠️ 危險區' : scene.type === 'dark' ? '🌑 黑暗' : '⚡ 普通'}</div>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        // ============= 加載統計 =============
        function loadStats() {
            const container = document.getElementById('statsContainer');
            const characters = getAllCharacters();
            const scenes = getAllScenes();

            container.innerHTML = `
                <div class="stat-card">
                    <div class="stat-number">${characters.length}</div>
                    <div class="stat-label">角色圖片</div>
                </div>
                <div class="stat-card">
                    <div class="stat-number">${scenes.length}</div>
                    <div class="stat-label">荒島場景</div>
                </div>
                <div class="stat-card">
                    <div class="stat-number">${characters.length + scenes.length}</div>
                    <div class="stat-label">總資源數</div>
                </div>
                <div class="stat-card">
                    <div class="stat-number">${Object.keys(gameResources.svgs).length}</div>
                    <div class="stat-label">SVG資源</div>
                </div>
            `;
        }

        // ============= 標籤切換 =============
        function switchTab(tabName) {
            // 隱藏所有標籤
            document.querySelectorAll('.tab-content').forEach(tab => {
                tab.classList.remove('active');
            });
            
            // 移除所有按鈕的active類
            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.classList.remove('active');
            });
            
            // 顯示選中的標籤
            document.getElementById(tabName).classList.add('active');
            
            // 激活對應的按鈕
            event.target.classList.add('active');
        }

        // ============= 匯出功能 =============
        function exportCharacterJSON() {
            const data = getAllCharacters();
            downloadJSON(data, 'characters.json');
        }

        function exportSceneJSON() {
            const data = getAllScenes();
            downloadJSON(data, 'scenes.json');
        }

        function exportAllSVG() {
            const svgs = gameResources.svgs;
            const svgText = Object.entries(svgs)
                .map(([key, value]) => `<!-- ${key} -->\n${value}`)
                .join('\n\n');
            downloadText(svgText, 'all-svgs.svg');
        }

        function downloadJSON(data, filename) {
            const json = JSON.stringify(data, null, 2);
            downloadText(json, filename);
        }

        function downloadText(text, filename) {
            const element = document.createElement('a');
            element.setAttribute('href', 'data:text/plain;charset=utf-8,' + encodeURIComponent(text));
            element.setAttribute('download', filename);
            element.style.display = 'none';
            document.body.appendChild(element);
            element.click();
            document.body.removeChild(element);
        }

        // 頁面加載
        window.addEventListener('DOMContentLoaded', initializePage);
    </script>
</body>
</html>
