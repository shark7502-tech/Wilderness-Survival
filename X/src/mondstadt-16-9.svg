<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Mondstadt by Cider Lake</title>
  <desc id="desc">An original 16:9 fantasy landscape illustration of a wind-swept walled city beside a lake, with a high cathedral, windmills, stone bridge, distant mountains and a lone traveler.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#76b5dc"/><stop offset=".54" stop-color="#b8d8dd"/><stop offset="1" stop-color="#f2d9a0"/></linearGradient>
    <linearGradient id="lake" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#70b9c6"/><stop offset="1" stop-color="#327b91"/></linearGradient>
    <linearGradient id="stone" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#e9d9ad"/><stop offset="1" stop-color="#a99876"/></linearGradient>
    <linearGradient id="roof" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#647e86"/><stop offset="1" stop-color="#344c5d"/></linearGradient>
    <linearGradient id="grass" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#a1b875"/><stop offset="1" stop-color="#4f7959"/></linearGradient>
    <radialGradient id="sunGlow"><stop stop-color="#fff1bf" stop-opacity=".82"/><stop offset="1" stop-color="#fff1bf" stop-opacity="0"/></radialGradient>
    <filter id="soft"><feGaussianBlur stdDeviation="22"/></filter>
    <filter id="shadow" x="-.2" y="-.2" width="1.4" height="1.5"><feGaussianBlur in="SourceAlpha" stdDeviation="9"/><feOffset dy="9"/><feComponentTransfer><feFuncA type="linear" slope=".24"/></feComponentTransfer><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
