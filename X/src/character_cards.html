<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>孫氏集團 - 角色卡系統</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            color: #fff;
            padding: 20px;
            min-height: 100vh;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            margin-bottom: 50px;
            border-bottom: 3px solid #d4af37;
            padding-bottom: 30px;
        }

        .header h1 {
            font-size: 48px;
            color: #d4af37;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.7);
            margin-bottom: 10px;
        }

        .header p {
            font-size: 18px;
            color: #aaa;
            margin-bottom: 5px;
        }

        .subtitle {
            color: #d4af37;
            font-size: 14px;
            margin-top: 10px;
        }

        .navigation {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 50px;
            flex-wrap: wrap;
        }

        .nav-btn {
            padding: 12px 25px;
            border: 2px solid #d4af37;
            background: linear-gradient(135deg, #2c3e50 0%, #34495e 100%);
            color: #d4af37;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            font-size: 14px;
            transition: all 0.3s ease;
            text-transform: uppercase;
        }

        .nav-btn:hover {
            background: linear-gradient(135deg, #34495e 0%, #2c3e50 100%);
            transform: scale(1.05);
            box-shadow: 0 0 15px rgba(212, 175, 55, 0.5);
        }

        .nav-btn.active {
            background: linear-gradient(135deg, #d4af37 0%, #c9a227 100%);
            color: #000;
        }

        .characters-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
            gap: 30px;
            margin-bottom: 50px;
        }

        .character-card {
            background: rgba(0, 0, 0, 0.5);
            border: 3px solid #d4af37;
            border-radius: 10px;
            padding: 25px;
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .character-card:hover {
            transform: translateY(-10px);
            box-shadow: 0 15px 30px rgba(212, 175, 55, 0.3);
            background: rgba(0, 0, 0, 0.7);
        }

        .card-header {
            text-align: center;
            border-bottom: 2px solid #d4af37;
            padding-bottom: 15px;
            margin-bottom: 15px;
        }

        .character-emoji {
            font-size: 60px;
            margin-bottom: 10px;
            display: block;
        }

        .character-name {
            font-size: 26px;
            color: #d4af37;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .character-position {
            font-size: 14px;
            color: #aaa;
        }

        .card-info {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 15px;
            font-size: 13px;
        }

        .info-item {
            background: rgba(212, 175, 55, 0.05);
            padding: 8px;
            border-left: 2px solid #d4af37;
        }

        .info-label {
            color: #d4af37;
            font-weight: bold;
            font-size: 12px;
        }

        .info-value {
            color: #fff;
            margin-top: 3px;
        }

        .personality-traits {
            background: rgba(212, 175, 55, 0.1);
            border: 1px solid #d4af37;
            padding: 12px;
            border-radius: 5px;
            margin-bottom: 12px;
            font-size: 13px;
        }

        .trait-label {
            color: #d4af37;
            font-weight: bold;
            margin-bottom: 5px;
            font-size: 12px;
        }

        .trait-value {
            color: #fff;
            line-height: 1.6;
        }

        .appearance-section {
            background: rgba(212, 175, 55, 0.1);
            border: 1px solid #d4af37;
            padding: 12px;
            border-radius: 5px;
            margin-bottom: 12px;
            font-size: 13px;
        }

        .appearance-title {
            color: #d4af37;
            font-weight: bold;
            margin-bottom: 8px;
            font-size: 12px;
        }

        .appearance-item {
            color: #fff;
            margin-bottom: 5px;
            line-height: 1.5;
        }

        .appearance-item strong {
            color: #d4af37;
        }

        .view-details-btn {
            width: 100%;
            padding: 10px;
            margin-top: 15px;
            border: 2px solid #d4af37;
            background: linear-gradient(135deg, #2c3e50 0%, #34495e 100%);
            color: #d4af37;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            font-size: 12px;
            transition: all 0.3s ease;
            text-transform: uppercase;
        }

        .view-details-btn:hover {
            background: linear-gradient(135deg, #34495e 0%, #2c3e50 100%);
            box-shadow: 0 0 10px rgba(212, 175, 55, 0.5);
        }

        .detailed-view {
            background: rgba(0, 0, 0, 0.5);
            border: 3px solid #d4af37;
            border-radius: 10px;
            padding: 30px;
            margin-bottom: 50px;
            display: none;
        }

        .detailed-view.active {
            display: block;
            animation: slideIn 0.3s ease;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .detailed-header {
            display: flex;
            align-items: center;
            gap: 30px;
            border-bottom: 2px solid #d4af37;
            padding-bottom: 20px;
            margin-bottom: 20px;
        }

        .detailed-emoji {
            font-size: 80px;
            flex-shrink: 0;
        }

        .detailed-basic-info {
            flex-grow: 1;
        }

        .detailed-basic-info h2 {
            font-size: 32px;
            color: #d4af37;
            margin-bottom: 10px;
        }

        .detailed-basic-info p {
            color: #aaa;
            margin: 5px 0;
            font-size: 14px;
        }

        .section {
            background: rgba(212, 175, 55, 0.1);
            border: 1px solid #d4af37;
            padding: 15px;
            border-radius: 5px;
            margin-bottom: 20px;
        }

        .section h3 {
            color: #d4af37;
            margin-bottom: 12px;
            font-size: 16px;
            border-bottom: 1px solid #d4af37;
            padding-bottom: 8px;
        }

        .section-content {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 15px;
            color: #fff;
        }

        .content-item {
            padding: 10px;
            background: rgba(0, 0, 0, 0.3);
            border-left: 3px solid #d4af37;
            border-radius: 3px;
        }

        .content-label {
            color: #d4af37;
            font-weight: bold;
            font-size: 12px;
            text-transform: uppercase;
            margin-bottom: 5px;
        }

        .content-value {
            color: #fff;
            line-height: 1.6;
        }

        .full-width {
            grid-column: 1 / -1;
        }

        .close-details {
            margin-top: 20px;
            padding: 10px 20px;
            border: 2px solid #d4af37;
            background: linear-gradient(135deg, #2c3e50 0%, #34495e 100%);
            color: #d4af37;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s ease;
        }

        .close-details:hover {
            background: linear-gradient(135deg, #34495e 0%, #2c3e50 100%);
            box-shadow: 0 0 10px rgba(212, 175, 55, 0.5);
        }

        .tabs {
            display: flex;
            gap: 10px;
            border-bottom: 2px solid #d4af37;
            margin-bottom: 20px;
        }

        .tab {
            padding: 12px 20px;
            background: rgba(212, 175, 55, 0.1);
            border: 1px solid #d4af37;
            border-radius: 5px 5px 0 0;
            cursor: pointer;
            color: #d4af37;
            font-weight: bold;
            transition: all 0.3s ease;
        }

        .tab:hover {
            background: rgba(212, 175, 55, 0.2);
        }

        .tab.active {
            background: linear-gradient(135deg, #d4af37 0%, #c9a227 100%);
            color: #000;
        }

        @media (max-width: 768px) {
            .characters-grid {
                grid-template-columns: 1fr;
            }

            .header h1 {
                font-size: 32px;
            }

            .detailed-header {
                flex-direction: column;
                text-align: center;
            }

            .section-content {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🏢 孫氏集團</h1>
            <p>角色卡系統</p>
            <p class="subtitle">瞭解每一位角色的個性、外觀與背景故事</p>
        </div>

        <div class="navigation">
            <button class="nav-btn active" onclick="showCharacter('all')">👥 全部角色</button>
            <button class="nav-btn" onclick="showCharacter('chenFeng')">👨 陳風</button>
            <button class="nav-btn" onclick="showCharacter('sunLili')">👩‍💼 孫莉莉</button>
            <button class="nav-btn" onclick="showCharacter('shuLi')">👩 淑麗</button>
            <button class="nav-btn" onclick="showCharacter('aLian')">👩‍🦰 阿蓮</button>
        </div>

        <!-- 詳細視圖 -->
        <div class="detailed-view" id="detailedView">
            <div class="detailed-header">
                <div class="detailed-emoji" id="detailEmoji">👨</div>
                <div class="detailed-basic-info">
                    <h2 id="detailName">陳風</h2>
                    <p id="detailPosition">孫氏集團底層員工</p>
                    <p id="detailGender">性別：男性</p>
                    <p id="detailAge">年齡：22歲</p>
                </div>
            </div>

            <div class="tabs">
                <div class="tab active" onclick="switchDetailTab('appearance')">👔 外觀</div>
                <div class="tab" onclick="switchDetailTab('personality')">💭 個性</div>
                <div class="tab" onclick="switchDetailTab('relationships')">🤝 關係</div>
                <div class="tab" onclick="switchDetailTab('background')">📖 背景</div>
            </div>

            <div class="section" id="appearanceTab">
                <h3>👔 外觀描述</h3>
                <div class="section-content">
                    <div class="content-item">
                        <div class="content-label">身高</div>
                        <div class="content-value" id="detailHeight">-</div>
                    </div>
                    <div class="content-item">
                        <div class="content-label">身材</div>
                        <div class="content-value" id="detailBuild">-</div>
                    </div>
                    <div class="content-item full-width">
                        <div class="content-label">服裝</div>
                        <div class="content-value" id="detailClothing">-</div>
                    </div>
                    <div class="content-item full-width">
                        <div class="content-label">髮型</div>
                        <div class="content-value" id="detailHairstyle">-</div>
                    </div>
                    <div class="content-item full-width">
                        <div class="content-label">配飾</div>
                        <div class="content-value" id="detailAccessories">-</div>
                    </div>
                    <div class="content-item full-width">
                        <div class="content-label">氣質表現</div>
                        <div class="content-value" id="detailExpression">-</div>
                    </div>
                </div>
            </div>

            <div class="section" id="personalityTab" style="display: none;">
                <h3>💭 個性特徵</h3>
                <div class="section-content">
                    <div class="content-item full-width">
                        <div class="content-label">性格特質</div>
                        <div class="content-value" id="detailTraits">-</div>
                    </div>
                    <div class="content-item full-width">
                        <div class="content-label">優點</div>
                        <div class="content-value" id="detailStrengths">-</div>
                    </div>
                    <div class="content-item full-width">
                        <div class="content-label">缺點</div>
                        <div class="content-value" id="detailWeaknesses">-</div>
                    </div>
                    <div class="content-item full-width">
                        <div class="content-label">溝通方式</div>
                        <div class="content-value" id="detailCommunication">-</div>
                    </div>
                    <div class="content-item full-width">
                        <div class="content-label">待人態度</div>
                        <div class="content-value" id="detailAttitude">-</div>
                    </div>
                </div>
            </div>

            <div class="section" id="relationshipsTab" style="display: none;">
                <h3>🤝 人際關係</h3>
                <div class="section-content" id="relationshipsContent">
                    <!-- 動態填充 -->
                </div>
            </div>

            <div class="section" id="backgroundTab" style="display: none;">
                <h3>📖 背景故事</h3>
                <div class="section-content">
                    <div class="content-item full-width">
                        <div class="content-label">背景</div>
                        <div class="content-value" id="detailBackground">-</div>
                    </div>
                    <div class="content-item full-width">
                        <div class="content-label">故事角色</div>
                        <div class="content-value" id="detailNarrativeRole">-</div>
                    </div>
                </div>
            </div>

            <button class="close-details" onclick="closeDetailedView()">✕ 關閉詳細視圖</button>
        </div>

        <!-- 角色卡片網格 -->
        <div class="characters-grid" id="charactersGrid">
            <!-- 動態填充 -->
        </div>
    </div>

    <script src="characters.js"></script>
    <script>
        // 初始化顯示
        function initializeCharacterCards() {
            displayCharacterGrid('all');
        }

        // 顯示角色網格
        function displayCharacterGrid(filter) {
            const grid = document.getElementById('charactersGrid');
            grid.innerHTML = '';

            const charsToShow = filter === 'all' ? Object.keys(characters) : [filter];

            charsToShow.forEach(key => {
                const char = characters[key];
                const card = document.createElement('div');
                card.className = 'character-card';
                card.innerHTML = `
                    <div class="card-header">
                        <span class="character-emoji">${char.appearance.emoji}</span>
                        <div class="character-name">${char.name}</div>
                        <div class="character-position">${char.position}</div>
                    </div>
                    <div class="card-info">
                        <div class="info-item">
                            <div class="info-label">性別</div>
                            <div class="info-value">${char.gender}</div>
                        </div>
                        <div class="info-item">
                            <div class="info-label">年齡</div>
                            <div class="info-value">${char.age}歲</div>
                        </div>
                        <div class="info-item">
                            <div class="info-label">身高</div>
                            <div class="info-value">${char.appearance.height}</div>
                        </div>
                        <div class="info-item">
                            <div class="info-label">身材</div>
                            <div class="info-value">${char.appearance.build}</div>
                        </div>
                    </div>
                    <div class="personality-traits">
                        <div class="trait-label">💭 性格特質</div>
                        <div class="trait-value">${char.personality.traits.join('、')}</div>
                    </div>
                    <div class="appearance-section">
                        <div class="appearance-title">👔 外觀重點</div>
                        <div class="appearance-item"><strong>服裝：</strong>${char.appearance.clothing}</div>
                        <div class="appearance-item"><strong>髮型：</strong>${char.appearance.hairstyle}</div>
                        <div class="appearance-item"><strong>氣質：</strong>${char.appearance.expression}</div>
                    </div>
                    <button class="view-details-btn" onclick="showDetailedView('${key}')">查看詳細資料</button>
                `;
                grid.appendChild(card);
            });
        }

        // 顯示詳細視圖
        function showDetailedView(characterKey) {
            const char = characters[characterKey];
            const detailView = document.getElementById('detailedView');

            // 填充基本信息
            document.getElementById('detailEmoji').textContent = char.appearance.emoji;
            document.getElementById('detailName').textContent = char.name;
            document.getElementById('detailPosition').textContent = char.position;
            document.getElementById('detailGender').textContent = `性別：${char.gender}`;
            document.getElementById('detailAge').textContent = `年齡：${char.age}歲`;

            // 填充外觀信息
            document.getElementById('detailHeight').textContent = char.appearance.height;
            document.getElementById('detailBuild').textContent = char.appearance.build;
            document.getElementById('detailClothing').textContent = char.appearance.clothing;
            document.getElementById('detailHairstyle').textContent = char.appearance.hairstyle;
            document.getElementById('detailAccessories').textContent = char.appearance.accessories;
            document.getElementById('detailExpression').textContent = char.appearance.expression;

            // 填充個性信息
            document.getElementById('detailTraits').textContent = char.personality.traits.join('、');
            document.getElementById('detailStrengths').textContent = char.personality.strengths.join('、');
            document.getElementById('detailWeaknesses').textContent = char.personality.weaknesses.join('、');
            document.getElementById('detailCommunication').textContent = char.personality.communicationStyle;
            document.getElementById('detailAttitude').textContent = char.personality.attitude;

            // 填充關係信息
            const relationshipsContent = document.getElementById('relationshipsContent');
            relationshipsContent.innerHTML = '';
            for (let relKey in char.relationships) {
                const rel = char.relationships[relKey];
                const targetChar = characters[relKey];
                if (targetChar) {
                    const item = document.createElement('div');
                    item.className = 'content-item full-width';
                    item.innerHTML = `
                        <div class="content-label">${targetChar.name}</div>
                        <div class="content-value">
                            <strong>身份：</strong>${rel.status}<br>
                            <strong>態度：</strong>${rel.attitude}
                        </div>
                    `;
                    relationshipsContent.appendChild(item);
                }
            }

            // 填充背景故事
            document.getElementById('detailBackground').textContent = char.background;
            document.getElementById('detailNarrativeRole').textContent = char.narrativeRole;

            // 顯示詳細視圖
            detailView.classList.add('active');
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // 切換詳細視圖標籤
        function switchDetailTab(tabName) {
            // 隱藏所有標籤
            document.getElementById('appearanceTab').style.display = 'none';
            document.getElementById('personalityTab').style.display = 'none';
            document.getElementById('relationshipsTab').style.display = 'none';
            document.getElementById('backgroundTab').style.display = 'none';

            // 更新標籤按鈕樣式
            document.querySelectorAll('.tab').forEach(tab => tab.classList.remove('active'));

            // 顯示選中的標籤
            if (tabName === 'appearance') {
                document.getElementById('appearanceTab').style.display = 'block';
                document.querySelectorAll('.tab')[0].classList.add('active');
            } else if (tabName === 'personality') {
                document.getElementById('personalityTab').style.display = 'block';
                document.querySelectorAll('.tab')[1].classList.add('active');
            } else if (tabName === 'relationships') {
                document.getElementById('relationshipsTab').style.display = 'block';
                document.querySelectorAll('.tab')[2].classList.add('active');
            } else if (tabName === 'background') {
                document.getElementById('backgroundTab').style.display = 'block';
                document.querySelectorAll('.tab')[3].classList.add('active');
            }
        }

        // 關閉詳細視圖
        function closeDetailedView() {
            document.getElementById('detailedView').classList.remove('active');
        }

        // 顯示角色
        function showCharacter(characterKey) {
            // 更新導航按鈕樣式
            document.querySelectorAll('.nav-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');

            // 關閉詳細視圖
            closeDetailedView();

            // 顯示角色網格
            displayCharacterGrid(characterKey);
        }

        // 頁面加載時初始化
        window.addEventListener('DOMContentLoaded', initializeCharacterCards);
    </script>
</body>
</html>
