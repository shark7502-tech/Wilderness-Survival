<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Windrest Mountain</title>
  <desc id="desc">Original 16:9 anime fantasy landscape of Windrest Mountain, with Jingfu Harbor along a bright blue coast, a windmill village on green slopes, and the quiet ruins of an old sanatorium beneath the high peaks.</desc>
